name: BitcoinPulse
options:
  bundleIdPrefix: com.bitcoinpulse
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
targets:
  BitcoinPulse:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bitcoinpulse.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Bitcoin Pulse
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
        CODE_SIGNING_ALLOWED: NO
schemes:
  BitcoinPulse:
    build:
      targets:
        BitcoinPulse: all
